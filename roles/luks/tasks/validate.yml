- name: ensure luks destructive operation is confirmed
  ansible.builtin.assert:
    that:
      - luks_confirm | bool
    fail_msg: luks_confirm must be true before changing the storage device

- name: ensure luks passphrase is provided
  ansible.builtin.assert:
    that:
      - luks_passphrase | length > 0
    fail_msg: luks_passphrase must not be empty

- name: ensure root device is identified
  ansible.builtin.assert:
    that:
      - ansible_mounts | selectattr('mount', 'equalto', '/') | list | length == 1
    fail_msg: gathered facts must contain the root filesystem mount

- name: ensure root device is collected
  ansible.builtin.set_fact:
    luks_root_device: >-
      {{ ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='device') | list | first }}

- name: ensure root device information is available
  ansible.builtin.assert:
    that:
      - luks_root_device | length > 0
    fail_msg: the root device could not be identified from gathered facts

- name: ensure luks device information is collected
  ansible.builtin.stat:
    path: "{{ luks_device }}"
    follow: true
  register: luks_device_stat

- name: ensure luks device exists
  ansible.builtin.assert:
    that:
      - luks_device_stat.stat.exists
    fail_msg: "{{ luks_device }} does not exist"

- name: ensure luks device is a block device
  ansible.builtin.assert:
    that:
      - luks_device_stat.stat.isblk
    fail_msg: "{{ luks_device }} must be a block device"

- name: ensure luks device names are available
  ansible.builtin.set_fact:
    luks_device_name: "{{ luks_device | basename }}"
    luks_root_device_name: "{{ luks_root_device | basename }}"
    luks_root_disk_name: "{{ luks_root_device | basename | regex_replace('p?[0-9]+$', '') }}"

- name: ensure luks device is not mounted
  ansible.builtin.assert:
    that:
      - luks_device not in (ansible_mounts | map(attribute='device') | list)
    fail_msg: "{{ luks_device }} is mounted and cannot be encrypted"

- name: ensure luks device is not the root device
  ansible.builtin.assert:
    that:
      - luks_device_name != luks_root_device_name
      - luks_device_name != luks_root_disk_name
    fail_msg: "{{ luks_device }} contains the root filesystem and cannot be encrypted"
